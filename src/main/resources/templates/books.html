<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <div class="d-flex align-items-center">
            <a th:href="@{/home}" class="d-flex align-items-center text-body-emphasis text-decoration-none me-auto">
                <span class="fs-4 fw-bold">📚 BookMarket</span>
            </a>
            <nav class="nav">
                <a th:href="@{/books/문학}" class="nav-link">문학</a>
                <a th:href="@{/books/동양철학}" class="nav-link">동양철학</a>
                <a th:href="@{/books/우주과학}" class="nav-link">우주과학</a>
            </nav>
        </div>
    </header>

    <div class="p-5 mb-4 bg-light rounded-3 text-center">
        <h1 class="display-5 fw-bold">도서 목록</h1>
        <p class="fs-4">우리 북마켓의 최신 도서들을 만나보세요.</p>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="book : ${bookList}">
            <div class="card h-100 shadow-sm">
                <div class="text-center p-3">
                    <img th:src="@{/imgs/{file}(file=${book.fileName})}"
                         class="card-img-top img-fluid"
                         style="max-height: 250px; width: auto;" alt="도서이미지">
                </div>
                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${book.name}">도서명</h5>
                    <p class="text-muted small" th:text="${book.author} + ' | ' + ${book.publisher}"></p>
                    <p class="card-text text-truncate" th:text="${book.description}">설명</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-primary fw-bold" th:text="${book.unitPrice} + '원'"></span>
                        <a th:href="@{/books/book(id=${book.bookId})}" class="btn btn-outline-secondary btn-sm">
                            상세정보 &raquo;
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="pt-3 mt-4 text-muted border-top text-center">
        &copy; 2026 BookMarket Project
    </footer>
</div>

</body>
</html>
