<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* 텍스트가 너무 길면 3줄까지만 보이고 ... 처리 */
        .description-clamp {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 4.5em; /* 카드 높이 균일화 */
        }
    </style>
</head>
<body>
<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <a th:href="@{/home}" class="d-flex align-items-center text-body-emphasis text-decoration-none">
            <img th:src="@{/imgs/book.png}" class="bi bi-book-half me-2" width="40" height="40">
            <span class="fs-4">BookMarket</span>
        </a>
    </header>

    <!-- 상단 점보트론 영역 여백 줄임 -->
    <div class="p-4 mb-4 bg-body-tertiary rounded-3">
        <div class="container-fluid py-3">
            <h1 class="display-6 fw-bold">소환사의 협곡에 오신것을 환영합니다</h1>
            <p class="col-md-8 fs-5 mb-0 text-secondary">미니언 생성까지 30초 남았습니다</p>
        </div>
    </div>

    <!-- 슬림하게 조절된 책 3권 레이아웃 -->
    <div class="row align-items-md-stretch text-center">
        <div class="col-md-4 mb-4" th:each="book : ${books}">
            <!-- p-5 -> p-3으로 패딩 축소 -->
            <div class="h-100 p-3 border rounded-3 bg-light d-flex flex-column align-items-center justify-content-between">
                <div>
                    <!-- 이미지 크기 적절히 축소 및 비율 유지 -->
                    <img th:src="@{/imgs/{filename}(filename=${book.fileName})}"
                         style="max-width: 120px; height: 160px; object-fit: cover;"
                         class="mb-3 rounded shadow-sm">
                    <h5 th:text="${book.name}" class="fw-bold mb-2">책 제목</h5>
                    <!-- 3줄을 넘어가면 ... 처리 -->
                    <p th:text="${book.description}" class="text-secondary small description-clamp mb-3">책 설명</p>
                </div>
                <div>
                    <p class="fs-6 text-primary fw-bold mb-2" th:text="${#numbers.formatInteger(book.unitPrice, 0, 'COMMA')} + '원'">가격</p>
                    <a th:href="@{/books/book(id=${book.bookId})}" class="btn btn-sm btn-outline-secondary px-3">상세 정보</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="pt-3 mt-4 text-body-secondary border-top">
        <span class="text-body-secondary">&copy; BookMarket</span>
    </footer>
</div>
</body>
</html>
