<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script th:src="@{/js/controller.js}"></script></head>
<body>
<main>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <a th:href="@{/home}" class="d-flex align-items-center text-body-emphasis text-decoration-none">
                <img th:src="@{/imgs/book.png}" class="bi bi-book-half me-2" width="50" height="50">
                <span class="fs-4">&nbsp;&nbsp;BookMarket</span>
            </a>
        </header>

        <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">도서 상세 정보</h1>
                <p class="col-md-8 fs-4">BookMarket</p>
            </div>
        </div>

        <div class="row align-items-md-stretch">
            <div class="col-md-4">
                <img th:src="@{/imgs/{filename}(filename=${book.fileName})}" style="width: 90%" class="rounded shadow-sm">
                <div class="text-center mt-2">
                    <a style="text-decoration-line: none" th:href="@{download(file=${book.fileName})}">이미지다운로드</a>
                </div>
            </div>

            <div class="col-md-8">
                <h3 th:text="${book.name}"></h3>
                <p th:text="${book.description}"></p>
                <br>
                <p><b>도서코드: </b><span th:text="${book.bookId}" class="badge text-bg-info"></span></p>
                <p><b>저자: </b><span th:text="${book.author}"></span></p>
                <p><b>출판사: </b><span th:text="${book.publisher}"></span></p>
                <p><b>출판일: </b><span th:text="${book.releaseDate}"></span></p>
                <p><b>분류: </b><span th:text="${book.category}"></span></p>
                <p><b>재고량: </b><span th:text="${book.unitsInStock}"></span></p>
                <h4 th:text="${#numbers.formatInteger(book.unitPrice, 0, 'COMMA')} + ' 원'"></h4>
                <br>
                <p>
                <form name="addForm" id="addForm" method="post">
                    <input type="hidden" name="_method" value="put"/>
                    <!-- 클릭 시 장바구니 담기 수행 후 이동 -->
                    <a th:href="'javascript:addToCart(\'' + ${book.bookId} + '\')'" class="btn btn-warning" role="button">장바구니 &raquo;</a>
                    <a th:href="@{/books}" class="btn btn-secondary" role="button">도서목록 &raquo;</a>
                </form>
            </div>
        </div>

        <footer class="pt-3 mt-4 text-body-secondary border-top">
            <span class="text-body-secondary">&copy; BookMarket</span>
        </footer>
    </div>
</main>
</body>
</html>
