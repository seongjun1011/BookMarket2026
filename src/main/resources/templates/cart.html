<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <a th:href="@{/home}" class="d-flex align-items-center text-body-emphasis text-decoration-none">
            <img th:src="@{/imgs/book.png}" class="bi bi-book-half me-2" width="50" height="50">
            <span class="fs-4">BookMarket</span>
        </a>
    </header>
    <div class="p-5 mb-4 bg-body-tertiary rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">장바구니</h1>
            <p class="col-md-8 fs-4">BookMarket</p>
        </div>
    </div>
    <div class="row align-items-md-stretch">

        <!-- 버튼 영역 (a 태그 대신 button 태그 사용 및 onclick 이벤트 추가) -->
        <div class="col-md-12 d-flex justify-content-between mb-3" th:if="${cart != null}">
            <!-- 전체 삭제 버튼 -->
            <button type="button" class="btn btn-danger" th:onclick="|clearCart('${cart.cartId}')|">전체 삭제</button>
            <a href="#" class="btn btn-success">주문하기</a>
        </div>

        <div style="padding-top: 30px">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>도서</th>
                    <th>가격</th>
                    <th>수량</th>
                    <th>소계</th>
                    <th>비고</th>
                </tr>
                </thead>
                <!-- tr 태그로 각 품목 출력 -->
                <!-- 수정된 <tbody> 파트: #numbers 포맷팅 제거 -->
                <tbody th:if="${cart != null and cart.cartItems != null}">
                <tr th:each="item : ${cart.cartItems}">
                    <!-- 주의: Book 클래스의 변수명이 name이 아니라 title이면 item.value.book.title 로 수정하세요 -->
                    <td th:text="${item.value.book.bookId} + ' - ' + ${item.value.book.name}"></td>

                    <!-- 주의: unitPrice가 아니라 price면 item.value.book.price 로 수정하세요 -->
                    <td th:text="${item.value.book.unitPrice} + '원'"></td>

                    <td th:text="${item.value.quantity} + '개'"></td>
                    <td th:text="${item.value.totalPrice} + '원'"></td>
                    <td>
                        <button type="button" class="btn btn-sm btn-outline-danger" th:onclick="|removeCartItem('${item.value.book.bookId}')|">삭제</button>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="text-end" style="padding-right: 30px">
                <b>
                    <!-- 수정된 총액 파트: #numbers 포맷팅 제거 -->
                    총액: <span th:if="${cart != null}" th:text="${cart.grandTotal} + '원'">0원</span>
                </b>
            </div>
            <br>
            <a th:href="@{/books}" class="btn btn-secondary">&laquo; 쇼핑 계속하기</a>
        </div>
    </div>
    <footer class="pt-3 mt-4 text-body-secondary border-top">
        <span class="text-body-secondary">&copy; BookMarket</span>
    </footer>
</div>

<!-- 자바스크립트 영역: DELETE 방식으로 서버에 요청을 보냄 -->
<script>
    // 개별 항목 삭제
    function removeCartItem(bookId) {
        if(confirm("이 도서를 장바구니에서 삭제하시겠습니까?")) {
            // 컨트롤러의 @DeleteMapping("/book/{bookId}") 로 요청 보냄
            fetch('/cart/book/' + bookId, {
                method: 'DELETE'
            }).then(response => {
                if(response.ok || response.status === 204) {
                    alert("삭제되었습니다.");
                    window.location.reload(); // 성공 후 페이지 새로고침
                } else {
                    alert("삭제 중 오류가 발생했습니다.");
                }
            }).catch(error => console.error('Error:', error));
        }
    }

    // 전체 삭제
    function clearCart(cartId) {
        if(confirm("장바구니를 모두 비우시겠습니까?")) {
            // 컨트롤러의 @DeleteMapping("/{cartId}") 로 요청 보냄
            fetch('/cart/' + cartId, {
                method: 'DELETE'
            }).then(response => {
                if(response.ok || response.status === 204) {
                    alert("장바구니가 모두 비워졌습니다.");
                    window.location.reload(); // 성공 후 페이지 새로고침
                } else {
                    alert("삭제 중 오류가 발생했습니다.");
                }
            }).catch(error => console.error('Error:', error));
        }
    }
</script>
</body>
</html>
