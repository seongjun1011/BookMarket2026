<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <a th:href="@{/home}" class="d-flex align-items-center text-body-emphasis text-decoration-none">
            <img th:src="@{/imgs/book.png}" class="bi bi-book-half me-2" width="50" height="50">
            <span class="fs-4">BookMarket</span>
        </a>
    </header>
    <div class="p-5 mb-4 bg-body-tertiary rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">장바구니</h1>
            <p class="col-md-8 fs-4">BookMarket</p>
        </div>
    </div>
    <div class="row align-items-md-stretch">
        <div class="col-md-12">
            <a href="#" class="btn btn-success" style="float: right">주문하기</a>
        </div>
        <div style="padding-top: 30px">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>도서</th>
                    <th>가격</th>
                    <th>수량</th>
                    <th>소계</th>
                    <th>비고</th>
                </tr>
                </thead>
                <!-- tr 태그로 각 품목 출력 -->
                <tbody th:if="${cart != null and cart.cartItems != null}">
                <tr th:each="item : ${cart.cartItems}">
                    <td th:text="${item.value.book.bookId} + ' - ' + ${item.value.book.name}"></td>
                    <td th:text="${#numbers.formatInteger(item.value.book.unitPrice, 0, 'COMMA')} + '원'"></td>
                    <td th:text="${item.value.quantity} + '개'"></td>
                    <td th:text="${#numbers.formatInteger(item.value.totalPrice, 0, 'COMMA')} + '원'"></td>
                    <td>
                        <!-- 삭제 버튼 등 추가 가능 -->
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="text-end" style="padding-right: 30px">
                <b>
                    총액: <span th:if="${cart != null}" th:text="${#numbers.formatInteger(cart.grandTotal, 0, 'COMMA')} + '원'">0원</span>
                </b>
            </div>
            <br>
            <a th:href="@{/books}" class="btn btn-secondary">&laquo; 쇼핑 계속하기</a>
        </div>
    </div>
    <footer class="pt-3 mt-4 text-body-secondary border-top">
        <span class="text-body-secondary">&copy; BookMarket</span>
    </footer>
</div>
</body>
</html>
