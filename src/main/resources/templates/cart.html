<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <div class="p-5 mb-4 bg-body-tertiary rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">장바구니</h1>
            <p class="col-md-8 fs-4">Book Market Cart List</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>도서코드</th>
                    <th>도서명</th>
                    <th>가격</th>
                    <th>수량</th>
                    <th>소계</th>
                    <th>비고</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${cart == null or cart.cartItems == null or cart.cartItems.isEmpty()}">
                    <td colspan="6" class="text-center">장바구니가 비어 있습니다.</td>
                </tr>
                <tr th:each="item : ${cart?.cartItems}">
                    <td th:text="${item.value.book.bookId}">ISBN1234</td>
                    <td th:text="${item.value.book.name}">도서제목</td>
                    <td th:text="${item.value.book.unitPrice}">10000</td>
                    <td th:text="${item.value.quantity}">1</td>
                    <td th:text="${item.value.totalPrice}">10000</td>
                    <td>
                        <a th:href="@{/cart/remove/{bookId}(bookId=${item.value.book.bookId})}"
                           class="btn btn-danger btn-sm">삭제</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-3">
        <a th:href="@{/books}" class="btn btn-secondary">&laquo; 쇼핑 계속하기</a>
        <div>
            <h4 th:text="'총액: ' + ${cart?.grandTotal != null ? cart.grandTotal : 0} + '원'">총액: 0원</h4>
        </div>
    </div>
</div>
</body>
</html>
