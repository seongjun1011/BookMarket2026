<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>잘못화된 도서번호 예외처리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <script src="/BookMarket/js/controllers.js"></script>

</head>
<body>
<main>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <a href="/BookMarket/home" class="d-flex align-items-center text-body-emphasis text-decoration-none">
                <img src="imgs/book_icon.png">
                <span class="fs-4">&nbsp;&nbsp;BookMarket</span>
            </a>
        </header>

        <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
                <h2 class="alert alert-danger">
                    요청한 도서가 존재하지 않습니다.
                </h2>
            </div>
        </div>
        <div class="row align-items-md-stretch">
            <h5>[[${url}]]</h5>
            <h5>[[${exceptionl}]]</h5>
            <a href="/BookMarket/books" class="btn btn-secondary" role="button">도서목록&raquo;</a>
        </div>


        <footer class="pt-3 mt-4 text-body-secondary border-top">
            <span class="text-body-secondary">&copy;2025 BookMarket</span>
        </footer>
    </div>
</main>
</body>
</html>
